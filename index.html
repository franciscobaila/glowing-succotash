<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">

</head>
<body style="margin:0;background:transparent">
<title>Antimatter Drive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0b0a1c;--panel:#15143a;--fg:#f3f0f7;--muted:#a9a4c4;--pink:#ec1489;--purple:#8e3acd;--line:#2b2960;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0;color:var(--muted);max-width:65ch}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:78vh;background:linear-gradient(200deg,#30187f 0%,#141334 45%,#0c1636 100%);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;text-align:center;padding:20px 20px 7%;background:linear-gradient(180deg,rgba(11,10,28,0) 45%,rgba(11,10,28,0.82) 100%),url(cover.jpg) center/cover no-repeat}
.cover svg{width:min(62%,460px);height:auto}
.cover .tag{color:#fff;font-size:20px;font-weight:650;text-shadow:0 1px 6px #000a}
button.start{font:inherit;font-weight:700;font-size:17px;line-height:1.2;color:#fff;background:#883ae1;border:0;border-radius:999px;padding:14px 28px;cursor:pointer}
button.start:hover{background:#7a2fd0}
button.start:disabled{opacity:.7;cursor:default}
.who{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.cover.sharing .who{display:none}
.who input,.who select{font:inherit;font-size:18px;font-weight:600;line-height:1.2;color:#fff;background:#0b0a1cb3;border:1.5px solid #ffffffa6;border-radius:999px;padding:14px 22px;width:270px;outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.who select{padding-right:44px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 25px) 55%,calc(100% - 18px) 55%;background-size:7px 7px;background-repeat:no-repeat}
.who select option{color:#15143a;background:#fff}
.who .whoT{display:flex;align-items:center;gap:12px;margin-left:20px}.who .whoT span{font-size:18px;font-weight:600;color:#fff;white-space:nowrap;text-shadow:0 1px 10px #0b0a1c,0 0 3px #0b0a1c}
.who input::placeholder{color:#ffffffa6}.who input:focus,.who select:focus{border-color:#b98cff;box-shadow:0 0 0 3px #883ae166}
.share{display:flex;flex-direction:column;align-items:center;gap:9px;color:#fff;text-shadow:0 1px 4px #000c}
.share img{display:block;width:auto;height:auto;max-width:min(58%,440px);max-height:min(46vh,300px);border-radius:10px;border:1px solid #ffffff40;box-shadow:0 10px 34px #000b}
.cover.sharing::before{content:"";position:absolute;inset:0;background:#0b0a1cc4}.cover.sharing>*{position:relative}.cover.sharing{justify-content:center;padding-bottom:20px}
.pill.pri{background:#883ae1;border-color:#883ae1}
.share .tagcta{font-size:18px;font-weight:600;line-height:1.3;max-width:34ch;text-wrap:balance}.share .tagcta b{color:#e9b8ff;font-weight:700}
.share .hint{font-size:12.5px;color:#ffffffd9;min-height:1.3em;max-width:44ch}
.cta{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font:inherit;font-size:14px;font-weight:650;color:#fff;background:#883ae1;border:0;border-radius:999px;padding:9px 17px;cursor:pointer;box-shadow:0 4px 16px #0006;white-space:nowrap}
.cta b{font-variant-numeric:tabular-nums;margin-left:5px}.cta:hover{background:#9a4ff0}
.share .bl{font-size:15px;font-weight:600}.share .bl b{font-size:19px;font-variant-numeric:tabular-nums;margin-left:4px}
.share .row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pill{font:inherit;font-size:14px;font-weight:700;line-height:1.2;color:#fff;background:#ffffff12;border:1.5px solid #ffffffa6;border-radius:999px;padding:9px 18px;cursor:pointer;text-decoration:none;text-shadow:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill:hover{background:#ffffff2e}
.bar{width:min(60%,280px);height:4px;border-radius:4px;background:#ffffff22;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}
.hud{position:absolute;left:14px;top:12px;display:flex;gap:18px;font-variant-numeric:tabular-nums;font-weight:600;color:#fff;text-shadow:0 1px 3px #000c;pointer-events:none}
.hud small{display:block;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ffffffd0}
.hud b{font-size:20px}
.msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-weight:650;font-size:18px;color:#fff;text-shadow:0 1px 4px #000c;pointer-events:none;opacity:0;transition:opacity .3s}
.stage canvas.map{position:absolute;inset:auto;right:10px;top:10px;left:auto;bottom:auto;width:118px;height:118px;pointer-events:none}
.pad{position:absolute;bottom:14px;display:none;gap:10px}
.pad.l{left:14px}.pad.r{right:14px}
.pad button{width:62px;height:62px;border-radius:50%;border:1px solid #ffffff70;background:#00000040;color:#fff;font-size:22px;font-weight:700}
.pad button.on{background:#ec1489aa}
@media (pointer:coarse){.pad{display:flex}}
/* mobile mode, from 991px wide down: touch buttons on and smaller, a taller game, no shortcut labels */
@media (max-width:991px){
  .pad{display:flex;gap:7px;bottom:10px}.pad.l{left:10px}.pad.r{right:10px}
  .pad{align-items:flex-end}.pad button{width:46px;height:46px;font-size:17px}.pad.l{gap:10px}.pad.l button{width:68px;height:68px;font-size:27px}.pad button#rst,.pad button#ext{font-size:10px!important}
  .keys{display:none!important}
  .cta{bottom:90px;font-size:13px;padding:8px 14px}.share img{max-width:62%;max-height:min(30vh,170px)}.who{width:100%;max-width:320px}.who input,.who select{width:100%;font-size:17px;padding:12px 20px}.who .whoT{width:100%;margin-left:0}.who .whoT span{font-size:17px}.who .whoT select{flex:1;min-width:0;width:auto}.share .tagcta{font-size:15.5px}.share{gap:15px}.share .row{gap:8px}.share .tagcta{line-height:1.38}.share .hint{margin-top:-4px}.pill{font-size:12.5px;padding:7px 13px}.cover.sharing{gap:18px;padding:12px}.cover.sharing .start{padding:11px 24px}
  .stage{aspect-ratio:3/4;max-height:88vh}
  .stage canvas.map{width:84px;height:84px}
  .hud{gap:10px;left:10px;top:9px;flex-wrap:wrap;max-width:calc(100% - 110px)}.hud b{font-size:16px}.hud small{font-size:9px}
  .cover{background:linear-gradient(180deg,rgba(11,10,28,0) 55%,rgba(11,10,28,0.8) 100%),url(cover_m.jpg) center/cover no-repeat;padding-bottom:12%}
}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px}
kbd{font:inherit;font-size:12px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.credit{font-size:12px}
</style>
<style>
:root{color-scheme:normal}
html,body{height:100%;background:transparent!important}body{padding:0!important;overflow:hidden}
.wrap{max-width:none;height:100%;gap:12px}h1,.wrap>p{display:none}
.stage{max-height:none;aspect-ratio:auto;flex:1 1 auto;min-height:0}
.keys{flex:0 0 auto;padding:0 2px 2px;color:#5a5873}
.keys kbd{color:#1b1a3a;background:#f3f1f8;border-color:#d8d4e6}
.stage{border-color:#e4e1ee}
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="cover" id="cover">
      <div class="share" id="share" hidden>
        <img id="shareImg" alt="The car with your lap time">
        <div class="bl"><span id="shareLbl">Your best lap</span> <b id="shareTime"></b></div>
        <div class="tagcta">Enter the leaderboard: share your lap with <b>#antimatterGT3</b> and tag <b>@antimattergroup</b></div>
        <div class="row"><button class="pill pri" id="shNative" hidden>Share</button><a class="pill" id="shX" target="_blank" rel="noopener">X</a><a class="pill" id="shLi" target="_blank" rel="noopener">LinkedIn</a><button class="pill" id="shIg">Instagram</button><a class="pill" id="shSave" download="Antimatter GT3.png">Save image</a><button class="pill" id="shCopy">Copy text</button></div>
        <div class="hint" id="shHint"></div>
      </div>
      <div class="who" id="who">
        <input id="whoName" type="text" maxlength="16" placeholder="Username" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Username">
        <label class="whoT"><span>Play as</span><select id="whoTeam" aria-label="Play as"><option value="0">Team Antimatter</option><option value="2">Sponsor GA Invest</option><option value="3">Sponsor Policloud</option><option value="4">Sponsor Hivenet</option><option value="5">Sponsor Elevatus</option><option value="6">Sponsor global.ventures</option><option value="7">Sponsor Shadeform</option></select></label>
      </div>
      <button class="start" id="start">Start driving</button>
      <div class="bar" id="bar" hidden><i></i></div>

    </div>
    <div class="hud" id="hud" hidden>
      <div><small>Speed</small><b id="spd">0</b> km/h</div>
      <div><small>Lap</small><b id="lap">0:00.000</b></div>
      <div><small>Best</small><b id="best">-</b></div>
    </div>
    <div class="msg" id="msg"></div>
    <button class="cta" id="cta" hidden>Enter the leaderboard <b id="ctaT"></b></button>
    <canvas class="map" id="map" width="260" height="260" hidden></canvas>
    <div class="pad l" id="padL" hidden><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
    <div class="pad r" id="padR" hidden><button id="ext" style="font-size:13px">EXIT</button><button id="rst" style="font-size:13px">RST</button><button data-k="brake">B</button><button data-k="gas">GO</button></div>
  </div>
  <div class="keys"><span><kbd>W</kbd> or <kbd>&uarr;</kbd> accelerate</span><span><kbd>S</kbd> or <kbd>&darr;</kbd> brake and reverse</span><span><kbd>A</kbd> <kbd>D</kbd> or <kbd>&larr;</kbd> <kbd>&rarr;</kbd> steer</span><span><kbd>C</kbd> camera</span><span><kbd>R</kbd> back on track</span><span><kbd>Enter</kbd> restart from the grid</span><span><kbd>Esc</kbd> exit</span></div>
</div>

<script>
(function(){
var LIBS=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js'];
var CAR_URL='car.json',LIVERY_URL='livery.jpg',LOGO_URL='logo.png';
var $=function(id){return document.getElementById(id)};
var stage=$('stage'),startBtn=$('start'),bar=$('bar'),fill=bar.firstElementChild;
// the driver's name and team: chosen on the cover, kept on this device, shown on the share image
var who={name:'',team:0},WHO_KEY='am-drive-who';
try{var w0=JSON.parse(localStorage.getItem(WHO_KEY)||'null');if(w0){who.name=String(w0.name||'').slice(0,16);who.team=+w0.team||0}}catch(e){}
$('whoName').value=who.name;$('whoTeam').value=String(who.team);if($('whoTeam').selectedIndex<0)$('whoTeam').selectedIndex=0;
function whoChanged(){who.name=$('whoName').value.replace(/\s+/g,' ').slice(0,16);who.team=+$('whoTeam').value||0;try{localStorage.setItem(WHO_KEY,JSON.stringify(who))}catch(e){}if(window.__amWho)window.__amWho()}
$('whoName').addEventListener('input',whoChanged);$('whoTeam').addEventListener('change',whoChanged);
$('whoName').addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter'){e.preventDefault();$('whoName').blur();startBtn.click()}});
function loadScript(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
startBtn.addEventListener('click',function(){
  if(window.__amResume){window.__amResume();return}
  startBtn.disabled=true;startBtn.textContent='Loading';bar.hidden=false;fill.style.width='10%';
  loadScript(LIBS[0]).then(function(){fill.style.width='25%';return loadScript(LIBS[1]).catch(function(){})}).then(function(){
    fill.style.width='35%';
    return new Promise(function(ok){
      if(!window.THREE.GLTFLoader)return ok(null);
      new THREE.GLTFLoader().load(CAR_URL,function(g){ok(g.scene)},function(e){if(e.total)fill.style.width=(35+60*e.loaded/e.total)+'%'},function(){ok(null)});
    });
  }).then(function(model){fill.style.width='100%';setTimeout(function(){init(model)},120)})
  .catch(function(){startBtn.disabled=false;startBtn.textContent='Could not load. Try again'});
});

function init(model){
  var T=window.THREE;$('cover').hidden=true;$('hud').hidden=false;$('padL').hidden=false;$('padR').hidden=false;
  var renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.outputEncoding=T.sRGBEncoding;
  stage.insertBefore(renderer.domElement,stage.firstChild);
  var SKY=0xbfd9f2,scene=new T.Scene();scene.background=new T.Color(SKY);scene.fog=new T.Fog(SKY,160,640);
  var cam=new T.PerspectiveCamera(55,16/9,0.4,1200);
  scene.add(new T.HemisphereLight(0xffffff,0x5d6b4a,0.95));var sun=new T.DirectionalLight(0xfff3e0,0.9);sun.position.set(-80,140,60);scene.add(sun);
  function size(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  size();window.addEventListener('resize',size);

  // ---- small painted textures ----
  function canvasTex(w,h,draw,rx,ry){var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);var t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;if(rx){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry)}t.anisotropy=4;return t}
  function speckle(base,spread,n){return function(g,w,h){g.fillStyle=base;g.fillRect(0,0,w,h);for(var i=0;i<n;i++){var v=Math.floor((Math.random()-0.5)*spread);g.fillStyle='rgba('+(v>0?'255,255,255,':'0,0,0,')+(Math.abs(v)/255).toFixed(3)+')';var s=1+Math.random()*2.5;g.fillRect(Math.random()*w,Math.random()*h,s,s)}}}
  var asphaltTex=canvasTex(256,256,speckle('#3f4046',70,5200),1,1),grassTex=canvasTex(256,256,speckle('#5f8f45',60,4200),90,90),gravelTex=canvasTex(128,128,speckle('#c9b68f',70,1800),1,1);

  // ---- track: a closed circuit with a start straight, a chicane, esses and a run of linked corners ----
  var raw=[[0,0],[80,0],[130,6],[158,-20],[192,-14],[204,24],[184,64],[190,104],[158,128],[122,112],[100,84],[66,86],[48,116],[40,152],[0,164],[-40,146],[-70,116],[-68,84],[-92,58],[-90,22],[-62,-14]];
  var curve=new T.CatmullRomCurve3(raw.map(function(p){return new T.Vector3(p[0],0,p[1])}),true,'catmullrom',0.5);
  var N=800,HALF=6.5,WALL=HALF+9.5,pts=curve.getSpacedPoints(N),P=[],Tn=[],K=[],LEN=curve.getLength();
  for(var i=0;i<N;i++){P.push(pts[i]);Tn.push(curve.getTangentAt(i/N).normalize())}
  for(var i=0;i<N;i++){var a=Tn[(i-6+N)%N],b=Tn[(i+6)%N];K.push(a.x*b.z-a.z*b.x)}          // signed bend: >0 turns one way, <0 the other
  // where the lap crosses itself, anything that stands above the asphalt (lines, kerbs, barriers) is left out so the junction is open tarmac
  function near2(x,z,k,gap,r){var r2=r*r;for(var j=0;j<N;j++){var d=Math.abs(j-k);if(d>N/2)d=N-d;if(d<=gap)continue;var dx=P[j].x-x,dz=P[j].z-z;if(dx*dx+dz*dz<r2)return true}return false}
  function clearAt(lat,r,gap){var m=[];for(var k=0;k<N;k++){var t=Tn[k];m.push(!near2(P[k].x-t.z*lat,P[k].z+t.x*lat,k,gap===undefined?40:gap,r))}return function(k){return m[k]}}
  function both(f,g){return function(k){return f(k)&&g(k)}}
  var Ks=[];for(var i=0;i<N;i++){var sK=0;for(var d=-10;d<=10;d++)sK+=Math.abs(K[(i+d+N)%N]);Ks.push(sK/21)}
  function ribbon(inner,outer,y,mat,opts){opts=opts||{};
    var pos=[],uv=[],col=[],idx=[],on=opts.on,c1=new T.Color(opts.c1||0xffffff),c2=new T.Color(opts.c2||opts.c1||0xffffff),vcount=0,prev=false;
    for(var i=0;i<=N;i++){var k=i%N,show=!on||on(k);
      if(show){var p=P[k],t=Tn[k],nx=-t.z,nz=t.x,cc=(Math.floor(i/3)%2)?c2:c1,y0=y+(opts.lift?opts.lift*k/N:0),y1=opts.y1===undefined?y0:opts.y1;
        pos.push(p.x+nx*inner,y0,p.z+nz*inner,p.x+nx*outer,y1,p.z+nz*outer);uv.push(0,i*LEN/N/(opts.vs||8),(opts.us||1),i*LEN/N/(opts.vs||8));col.push(cc.r,cc.g,cc.b,cc.r,cc.g,cc.b);
        if(prev){var a=vcount-2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}vcount+=2}
      prev=show}
    var g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();
    var m=new T.Mesh(g,mat);scene.add(m);return m}
  var ground=new T.Mesh(new T.PlaneGeometry(1800,1800),new T.MeshLambertMaterial({map:grassTex}));ground.rotation.x=-Math.PI/2;ground.position.set(30,-0.06,80);scene.add(ground);
  asphaltTex.wrapS=asphaltTex.wrapT=T.RepeatWrapping;gravelTex.wrapS=gravelTex.wrapT=T.RepeatWrapping;
  var flat=function(o){o.side=T.DoubleSide;return new T.MeshLambertMaterial(o)},vc=new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide});
  var bend=function(th){return function(k){return Ks[k]>th}};
  ribbon(-HALF-6,HALF+6,-0.03,flat({map:gravelTex}),{on:bend(0.2),us:6,vs:3});                       // gravel traps on the corners
  ribbon(-HALF,HALF,-0.012,flat({map:asphaltTex}),{us:5,vs:2.6,lift:0.012});            // each part of the lap sits a hair higher than the last, so the crossings do not flicker
  [-1,1].forEach(function(s){ribbon(s*(HALF-0.5),s*(HALF-0.25),0.014,vc,{c1:0xf2f2f2,on:clearAt(s*(HALF-0.37),HALF+0.3)});
    ribbon(s*HALF,s*(HALF+1.4),0.022,vc,{c1:0xd3202a,c2:0xf5f5f5,on:both(bend(0.1),clearAt(s*(HALF+0.7),HALF+1.0))})});
  // barriers both sides: steel rail on corners' outside, concrete elsewhere
  var railM=flat({color:0xb9bec6}),wallM=flat({color:0xd9d9d4}),capM=flat({color:0xe9e9e4});
  var wallOn={};[-1,1].forEach(function(s){var w=wallOn[s]=clearAt(s*(WALL+0.25),WALL-0.3,3);ribbon(s*WALL,s*WALL,0,wallM,{y1:1.05,on:w});ribbon(s*WALL,s*(WALL+0.5),1.05,capM,{on:w});ribbon(s*(WALL+0.5),s*(WALL+0.5),1.05,wallM,{y1:0,on:w})});
  // start line, grid slots
  var S0=6;function along(i,lat,y){var t=Tn[i];return new T.Vector3(P[i].x-t.z*lat,y,P[i].z+t.x*lat)}
  var chk=canvasTex(64,16,function(g){for(var x=0;x<8;x++)for(var y=0;y<2;y++){g.fillStyle=(x+y)%2?'#111':'#f5f5f5';g.fillRect(x*8,y*8,8,8)}});
  var sl=new T.Mesh(new T.PlaneGeometry(HALF*2,1.6),new T.MeshBasicMaterial({map:chk}));sl.rotation.x=-Math.PI/2;sl.position.copy(along(S0,0,0.03));sl.rotation.z=-Math.atan2(Tn[S0].z,Tn[S0].x)+Math.PI/2;scene.add(sl);
  var slotM=new T.MeshBasicMaterial({color:0xf2f2f2});
  for(var g=0;g<6;g++){var gi=(S0-8-g*9+N)%N,lat=(g%2?1:-1)*2.6,b1=new T.Mesh(new T.PlaneGeometry(0.25,2.6),slotM);b1.rotation.x=-Math.PI/2;b1.position.copy(along(gi,lat,0.025));b1.rotation.z=-Math.atan2(Tn[gi].z,Tn[gi].x);scene.add(b1)}
  // gantry over the start line
  var steelM0=new T.MeshLambertMaterial({color:0x4a4d58}),navyM=new T.MeshLambertMaterial({color:0x1b1a3a}),pinkM=new T.MeshLambertMaterial({color:0xec1489});
